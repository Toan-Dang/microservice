# .github/workflows/deploy.yml
# Deploy: SSH vào EC2 -> pull image mới từ ECR -> restart docker compose.
# Cách A (GitHub Actions deploy trực tiếp). Cách B (AWS CodePipeline) nằm ở thư mục cicd/aws.

name: Deploy to EC2

on:
  workflow_call:      # được gọi từ ci.yml
  workflow_dispatch:  # cho phép chạy tay

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}         # IP public của EC2
          username: ${{ secrets.EC2_USER }}     # ví dụ: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}       # nội dung private key (.pem)
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/app
            # đăng nhập ECR (EC2 đã gắn IAM role đọc ECR)
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
            export TAG=latest
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
