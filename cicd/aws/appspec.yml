# appspec.yml — dùng bởi AWS CodeDeploy (EC2/on-premises).
# CodeDeploy agent trên EC2 đọc file này, copy source & chạy các hook script.

version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/app

permissions:
  - object: /home/ec2-user/app
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - directory

hooks:
  ApplicationStop:
    - location: cicd/aws/scripts/stop.sh
      timeout: 120
      runas: ec2-user
  AfterInstall:
    - location: cicd/aws/scripts/install.sh
      timeout: 180
      runas: ec2-user
  ApplicationStart:
    - location: cicd/aws/scripts/start.sh
      timeout: 300
      runas: ec2-user
