# Ingress — bậc 2 tương đương ALB + target group + listener của bậc 1.
# Khác biệt cốt lõi: ở ECS bạn TẠO ALB bằng tay; ở EKS bạn KHAI BÁO Ingress và
# AWS Load Balancer Controller tự tạo/xoá ALB. Đó là "declarative" vs "imperative".
#
# Cài controller trước (Ngày 7):
#   helm repo add eks https://aws.github.io/eks-charts
#   helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#     -n kube-system --set clusterName=ecommerce \
#     --set serviceAccount.create=false --set serviceAccount.name=aws-load-balancer-controller
#
# ⚠️ XOÁ INGRESS TRƯỚC KHI XOÁ CLUSTER. Xoá cluster trước → controller biến mất →
#    ALB thành mồ côi, vẫn tính $0.55/ngày cho tới khi bạn phát hiện ra hoá đơn.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: ecommerce
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip          # trỏ thẳng IP pod, bỏ 1 hop kube-proxy
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway      # CHỈ gateway. 4 service kia không bao giờ ra internet.
                port:
                  number: 3000
