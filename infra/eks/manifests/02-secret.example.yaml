# MẪU — KHÔNG commit file có giá trị thật, và KHÔNG apply file này trực tiếp.
#
# Cách tạo Secret thật (đọc từ AWS Secrets Manager, không gõ tay):
#     ./deploy/eks/create-secrets.sh
#
# `kubectl create secret` chỉ base64 — KHÔNG mã hoá. Dữ liệu nằm plaintext trong etcd.
# Đường chuẩn production: External Secrets Operator hoặc Secrets Store CSI Driver + IRSA
# → pod tự lấy secret từ Secrets Manager lúc runtime, không có bản copy trong cluster.
# Đối chiếu bậc 1: ECS làm việc này qua `secrets[].valueFrom` + execution role.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: ecommerce
type: Opaque
stringData:
  JWT_SECRET: ""
  AUTH_DATABASE_URL: ""     # postgres://user:pass@<rds>:5432/auth_db?sslmode=no-verify
  PRODUCT_DATABASE_URL: ""  # postgres://user:pass@<rds>:5432/product_db?sslmode=no-verify
  ORDER_DATABASE_URL: ""    # postgres://user:pass@<rds>:5432/order_db?sslmode=no-verify
  RABBITMQ_URL: ""          # amqps://user:pass@<broker>.mq.us-east-1.amazonaws.com:5671
