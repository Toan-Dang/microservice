syntax = "proto3";

package product;

// Service sản phẩm — order-service gọi CheckStock đồng bộ (sync) trước khi tạo đơn
service ProductService {
  rpc Create (CreateProductRequest) returns (Product);
  rpc FindOne (FindOneRequest) returns (Product);
  rpc FindMany (FindManyRequest) returns (ProductList);
  rpc CheckStock (CheckStockRequest) returns (CheckStockResponse);
}

message Product {
  string id = 1;
  string name = 2;
  double price = 3;
  int32 stock = 4;
}

message CreateProductRequest {
  string name = 1;
  double price = 2;
  int32 stock = 3;
}

message FindOneRequest {
  string id = 1;
}

message FindManyRequest {
  int32 page = 1;
  int32 limit = 2;
}

message ProductList {
  repeated Product products = 1;
  int32 total = 2;
}

message CheckStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckStockResponse {
  bool available = 1;
  double price = 2;
  int32 remaining = 3;
}
