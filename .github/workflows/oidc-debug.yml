# TẠM THỜI — chỉ để debug OIDC. Xoá file này sau khi pipeline chạy được.
# Chạy tay: Actions → OIDC Debug → Run workflow (branch main).
name: OIDC Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: In claim của OIDC token
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          # Chỉ in phần payload đã decode — KHÔNG in token.
          echo "$TOKEN" | cut -d. -f2 | python3 -c \
            'import sys,base64,json; s=sys.stdin.read().strip(); s+="="*(-len(s)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(s)), indent=2))' \
            | jq '{sub, aud, repository, repository_owner, ref, event_name, workflow_ref}'

      - name: Độ dài & đuôi của secret AWS_ROLE_ARN
        env:
          ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          # GitHub che giá trị secret, nên chỉ in độ dài + 12 ký tự cuối tách khoảng trắng để đối chiếu.
          echo "length = ${#ARN}   (arn:aws:iam::382876615033:role/github = 37)"
          echo "tail    = $(printf '%s' "${ARN: -12}" | sed 's/./& /g')"
